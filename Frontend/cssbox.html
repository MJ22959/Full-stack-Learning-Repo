<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style >
    * {
        margin: 0;
        padding: 100px;
        box-sizing: border-box;
    }
    .parent {
        width: 100px;
        height: 100px;
        display: flex;
        top:50%;
        left: 50%;
        padding: 100px;
        position: relative;
        transform: translate(-50%, -50%);

    }
    .child1 {
        width: 100px;
        height: 100px;
        background-color: red;
        position: absolute;
        top: 0;
        padding: 200px;
        left: 0;
    }
    .child2 {
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: blue;
        position: absolute;
        padding: 200px;
        top: 0;
        left: 0;
        transform: translate(50px, 50px) scale(3);
    }
    .box {
        width: 200px;
        height: 200px;
        border: 2px solid red;
        margin: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
    }
    .box1 {
        background-color: red;
        transform: translate(50px, 50px) scale(3);
    }
    .box2 {
        background-color: blue;
        transform: translate(50px, 50px) rotate(45deg);
    }
</style>
<body>
    <div class="parent">
    <div class="child1">0</div>
    <div class="child2">1</div>   
    <div class="box">2</div>
    <div class="box box1">3</div>
    <div class="box box2">4</div>   
    <div >Hello</div>
    </div>
</body>
</html>
