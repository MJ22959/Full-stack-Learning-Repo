<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Day 1 - Images and Graphics</title>
        <link rel="icon" type="image/x-icon" href="htmlicon.jpeg">
    </head>
    <body>
        <h1>Day 1 - Images and Graphics</h1>
        <p>In this lesson, we will learn about how to use images and graphics in HTML.</p>
        <h2>SVG images type</h2>
        <img src="images/sample-image.jpg" alt="Sample Image">
        <p>We can also use SVG graphics for scalable vector images.</p>
        <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
        </svg>
        <h2>JPEG, PNG, GIF, URL Image type</h2>
        <img src="htmlicon.jpeg" alt="HTML Icon" width="200px" height="200px" title="HTML NET Import Picture"/>
        <h2>Captioning the Images</h2>
        <figure>
            <img src="htmlicon.jpeg" alt="HTML Icon" width="200px" height="200px" title="HTML NET Import Picture"/>
            <figcaption>This is a sample example of HTMl Icon Image </figcaption>
        </figure>
    </body>

</html>
