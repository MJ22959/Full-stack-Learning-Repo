    .keyframes bounce{
        
        0%{
            background-color: red;
            transform: translateX(0px);
        }
        25%{
            background-color: blue;
            transform: translateX(100px);
        }
        50%{
            background-color: green;
            transform: translate(100px);
        }
        75%{
            background-color: yellow;
            transform: translateX(100px);
        }
        100%{
            background-color: red;
            transform: translateX(0px);
        }
    }
    
    
    .main{
