<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Day 2 - Media Elements</title>
        <link rel="icon" type="image/x-icon" href="htmlicon.jpeg">
    </head>
    <body>
        <h1>Day 2 - Media Elements</h1>
        <p>In this lesson, we will learn about how to use media elements in HTML.</p>
        <h2>Video Element</h2>
        <video width="320" height="240" controls>
            <source src="Samplevideo.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h2>Audio Element</h2>
        <audio controls>
            <source src="sample.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <h2>iframe Element</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/b9nxnU1GkTg?list=RDb9nxnU1GkTg" title="Animal Song | The Sounds of the Animals (FUN Kids Song!)" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
